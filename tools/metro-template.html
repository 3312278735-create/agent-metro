}

/* 悬浮提示 */
const tip = $("#tip");
function showTip(el) {
  const s = byId.get(el.dataset.id);
  if (!s) return;
  const dates = [s.created && `提出 ${s.created}`, s.done && `到站 ${s.done}`, s.paused && `暂缓 ${s.paused}`, s.due && s.due !== "none" && `截止 ${s.due}`].filter(Boolean).join(" · ");
  tip.innerHTML = `<div class="t-id">${dot(s.state, true)}#${esc(s.id)} · ${esc(s.project)} · ${STATES[s.state].label}</div>
    <div>${esc(s.text.length > 150 ? s.text.slice(0, 150) + "…" : s.text)}</div>
    <div class="t-dates">${esc(dates)}${s.exec ? " · " + esc(EXEC[s.exec] || s.exec) : ""}${SERVER ? " · 点击或右键可更新" : ""}</div>`;
  tip.hidden = false;
  const r = el.getBoundingClientRect(), t = tip.getBoundingClientRect();
  let x = r.left + r.width / 2 - t.width / 2;
  x = Math.max(8, Math.min(x, window.innerWidth - t.width - 8));
  let y = r.top - t.height - 8;
  if (y < 8) y = r.bottom + 8;
  tip.style.left = x + "px";
  tip.style.top = y + "px";
}
function hideTip() { tip.hidden = true; }

/* 提示条 */
let toastTimer = 0;
function toast(msg, ms = 3200) {
  const el = $("#toast");
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, ms);
}

/* 请求本地服务：连不上、或者迟迟不答话（服务卡住了）都换成一句能照着做的话 */
const NO_SERVER = "连不上看板服务：双击看板目录里的「打开地铁图.bat」重新打开";
const STUCK_SERVER = "看板服务没有响应：双击看板目录里的「打开地铁图.bat」，它会换掉卡住的服务，然后刷新本页";
async function callServer(path, init, ms = 15000) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  try {
    return await fetch(path, { ...init, signal: ctl.signal });
  } catch (e) {
    throw new Error(e.name === "AbortError" ? STUCK_SERVER : NO_SERVER);
  } finally {
    clearTimeout(timer);
  }
}

/* 写回台账（只有本地服务模式可用） */
async function api(path, body) {
  let r;
  try {
    r = await callServer(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Board-Token": SERVER.token }, body: JSON.stringify(body) });
  } catch (e) {
    throw new Error(e.message === STUCK_SERVER ? `${STUCK_SERVER}，看看刚才这一步生效了没有` : e.message);
  }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `出错了（${r.status}）`);
  return j;
}
// 服务端的 warnings 是「已照常执行，但顺带提醒一句」，接在成功提示后面，多停留几秒。
function reloadWith(msg, res) {
  const warnings = (res && res.result && res.result.warnings) || [];
  const full = warnings.length ? `${msg}（${warnings.join("；")}）` : msg;
  try { sessionStorage.setItem("metro-flash", JSON.stringify({ msg: full, y: window.scrollY, ms: warnings.length ? 9000 : 3200 })); } catch (e) {}
  location.reload();
}

/* 面板与对话框 */
const scrim = $("#scrim");
let lastFocus = null;
function openModal(html, { center = false } = {}) {
  hideTip();
  if (scrim.hidden) lastFocus = document.activeElement;
  scrim.classList.toggle("center", center);
  scrim.innerHTML = html;
  scrim.hidden = false;
}
function closeModal() {
  if (scrim.hidden) return;
  scrim.hidden = true;
  scrim.innerHTML = "";
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}

function editBlock(s) {
  if (!SERVER) return `<div class="readonly-note">这是只读页面。双击看板目录里的「打开地铁图.bat」打开，就能在这里改这一站的状态、写备注。</div>`;
  if (s.lineArchived) return `<div class="readonly-note">「${esc(s.project)}」整条线已归档。要改它的站点，先在线路左侧点「恢复项目」。</div>`;
  return `<form class="edit" id="edit" data-id="${esc(s.id)}" data-state="${s.state}">
    <h3>更新这一站</h3>
    <fieldset class="picker" aria-label="状态">
      ${Object.keys(STATES).map((k) => `<label class="opt"><input type="radio" name="st" value="${k}"${k === s.state ? " checked" : ""}>${dot(k, true)}<span>${STATES[k].label}<small>${STATES[k].hint}</small></span></label>`).join("")}
    </fieldset>
    ${accOf(s) === "auto" ? `<label class="opt opt-check"><input type="checkbox" name="verified"><span>我亲手验过了<small>这站现在是 <span class="acc acc-auto">自动验收</span>，勾上改成 <span class="acc acc-me">人工验收</span></small></span></label>` : ""}
    <label class="field-label" for="note">备注（可不填；不改状态、只写备注也可以）</label>
    <textarea id="note" name="note" rows="3" maxlength="500" placeholder="例如：已在真机上验过 / 方向变了，不做了 / 卡在等运维"></textarea>
    <div class="actions"><button type="submit" class="btn primary" disabled>提交</button><span class="hint" id="edit-hint">选一个新状态，或写点备注</span></div>
    <div class="err" id="edit-err" hidden></div>
  </form>`;
}

function openSheet(id, { focusEdit = false } = {}) {
  const s = byId.get(id);
  if (!s) return;
  const row = (k, v) => (v ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : "");
  const hist = s.history && s.history.length
    ? `<h3>变更记录</h3><ul class="hist">${s.history.map((h) => `<li><span class="when">${esc(h.at)}</span> · ${esc(h.change)}${h.note ? `<span class="note">${esc(h.note)}</span>` : ""}</li>`).join("")}</ul>`
    : "";
  openModal(`<aside class="sheet" role="dialog" aria-modal="true" aria-label="需求详情">
    <div class="sheet-top"><span class="state">${dot(s.state)}${STATES[s.state].label}${accTag(s)}</span>
      <span style="display:inline-flex;gap:8px;align-items:center">${SERVER
        ? `<button type="button" class="btn" data-pin-task="${esc(s.id)}" aria-pressed="${!!s.pinned}" style="display:inline-flex;align-items:center;gap:6px"><span style="width:14px;display:inline-grid">${PIN(s.pinned)}</span>${s.pinned ? "取消置顶" : "置顶这一站"}</button>`
        : s.pinned ? `<span class="tag"><span style="width:12px;display:inline-grid">${PIN(true)}</span>已置顶</span>` : ""}
      <button type="button" class="btn" data-close>关闭</button></span></div>
    <h2>${esc(s.title)}</h2>
    <div class="sub">#${esc(s.id)} · ${s.lineNo} 号线 ${esc(s.project)}</div>
    <div class="full">${esc(s.text)}</div>
    ${editBlock(s)}
    <h3>这一站的信息</h3>
    <dl class="kv">
      ${row("优先级", s.priority)}
      ${row("谁来做", EXEC[s.exec] || "")}
      ${row("提出日期", s.created)}
      ${row("到站日期", s.done)}
      ${row("验收方式", accOf(s) ? `${ACCEPT[accOf(s)].label}：${ACCEPT[accOf(s)].hint}` : "")}
      ${row("暂缓日期", s.paused)}
      ${row("归档日期", s.archived)}
      ${row("截止日", s.due && s.due !== "none" ? s.due : "")}
      ${row("记录位置", s.source)}
    </dl>
    ${hist}
    ${s.linePage ? `<div class="links"><a href="${s.linePage}">打开「${esc(s.project)}」项目页</a>（现状、下一步、待你验收、进展日志）</div>` : ""}
  </aside>`);
  const form = $("#edit");
  if (form) wireEdit(form);
  (focusEdit && form ? form.querySelector("input:checked") : $("[data-close]")).focus();
}

function wireEdit(form) {
  const btn = form.querySelector("button[type=submit]");
  const hint = $("#edit-hint"), err = $("#edit-err");
  const current = form.dataset.state;
  const refresh = () => {
    const st = form.st.value, note = form.note.value.trim();
    const verified = !!(form.verified && form.verified.checked && st === "done");
    btn.disabled = st === current && !note && !verified;
    hint.textContent = st !== current ? `${STATES[current].label} → ${STATES[st].label}${st === "done" ? "（人工验收）" : ""}` : verified ? "自动验收 → 人工验收" : note ? "只记一条备注，状态不变" : "选一个新状态，或写点备注";
  };
  form.addEventListener("input", refresh);
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    btn.disabled = true; err.hidden = true; hint.textContent = "正在写入台账…";
    try {
      const st = form.st.value;
      // 你在这里把一站点成「已到站」，或勾「我亲手验过了」= 人工验收
      const verified = !!(form.verified && form.verified.checked);
      const accept = st === "done" && (current !== "done" || verified) ? "me" : "";
      const res = await api("/api/set-status", { id: form.dataset.id, status: st, note: form.note.value, accept });
      reloadWith(st !== current ? `#${form.dataset.id} 已更新：${STATES[current].label} → ${STATES[st].label}` : accept ? `#${form.dataset.id} 已改成人工验收` : `#${form.dataset.id} 已记下备注`, res);
    } catch (ex) {
      err.textContent = ex.message; err.hidden = false; refresh();
    }
  });
}

function openLineDialog(name, act) {
  const l = lineByName.get(name);
  if (!l) return;
  const open = l.review + l.doing + l.todo + l.paused;
  const body = act === "archive"
    ? `<h2>归档「${esc(name)}」这条线？</h2>
       <ul>
         <li>已到站的 <b>${l.done}</b> 站：移入归档，保持绿色。</li>
         ${open ? `<li>还有 <b>${open}</b> 站没标完成——它们怎么算，在下面选。</li>` : ""}
         <li>这条线会收进页面底部的「已归档线路」，不再出现在日常视野和每日焦点里。</li>
       </ul>
       ${open ? `<fieldset class="picker" aria-label="没标完成的站怎么算" style="grid-template-columns:1fr">
         <label class="opt"><input type="radio" name="undone" value="dropped" checked>${dot("dropped", true)}<span>没做完，标为「停运」<small>灰色 ×，不会变绿——项目不做了 / 先搁置</small></span></label>
         <label class="opt"><input type="radio" name="undone" value="done">${dot("done", true)}<span>其实做完了，算「已到站」<small>变绿，到站日期记今天——项目完成了，只是之前没来得及标</small></span></label>
       </fieldset>` : ""}
       <p>随时可以在已归档线路上点「恢复项目」，所有站会按原来的状态放回去。</p>`
    : `<h2>恢复「${esc(name)}」这条线？</h2>
       <p>归档时移走的站会按原来的状态放回台账：到站的仍是到站，没做完的回到待验收 / 进行中 / 未到站 / 暂缓。</p>`;
  openModal(`<form class="dialog" id="line-form" role="dialog" aria-modal="true">
    ${body}
    <label class="field-label" for="line-note">备注（可不填）</label>
    <textarea id="line-note" rows="2" maxlength="500" placeholder="${act === "archive" ? "例如：项目已交付 / 不再维护" : "例如：客户又提了新需求"}"></textarea>
    <div class="actions"><button type="submit" class="btn primary">${act === "archive" ? "确认归档" : "确认恢复"}</button><button type="button" class="btn" data-close>取消</button></div>
    <div class="err" id="line-err" hidden></div>
  </form>`, { center: true });
  const form = $("#line-form");
  form.querySelector("[data-close]").focus();
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = form.querySelector("button[type=submit]"), err = $("#line-err");
    btn.disabled = true; err.hidden = true;
    try {
      const undoneAs = form.undone ? form.undone.value : "dropped";
      const res = await api(act === "archive" ? "/api/archive-project" : "/api/restore-project", { name, note: $("#line-note").value, undoneAs });
      reloadWith(act === "archive" ? `「${name}」已归档。在「含已归档」里可以找到并恢复。` : `「${name}」已恢复`, res);
    } catch (ex) {
      err.textContent = ex.message; err.hidden = false; btn.disabled = false;
    }
  });
}

/* 事件 */
for (const [id, key] of [["#f-state", "state"], ["#f-scope", "scope"], ["#f-view", "view"]]) {
  $(id).addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    filters[key] = b.dataset.v;
    saveFilters();
    render();
  });
}
$("#f-q").addEventListener("input", (e) => { filters.q = e.target.value.trim(); render(); });
$("#f-pin").addEventListener("click", () => setPinFilter(!filters.pin));
// 「筛选」面板开没开只记在本机浏览器里
const FILTERS_OPEN_KEY = "metro-filters-open-v1";
try { $("#filters").hidden = localStorage.getItem(FILTERS_OPEN_KEY) !== "1"; } catch (e) {}
$("#f-toggle").addEventListener("click", () => {
  const panel = $("#filters");
  panel.hidden = !panel.hidden;
  try { localStorage.setItem(FILTERS_OPEN_KEY, panel.hidden ? "0" : "1"); } catch (e) {}
  renderHeader();
});
$("#belt").addEventListener("click", (e) => {
  const more = e.target.closest("[data-belt-more]");
  if (more) { const i = +more.dataset.beltMore; beltOpen.has(i) ? beltOpen.delete(i) : beltOpen.add(i); return renderBelt(); }
  const b = e.target.closest("[data-jump]");
  if (b) jumpTo(b.dataset.jump);
});
$("#todo").addEventListener("click", (e) => {
  if (e.target.closest("#todo-more")) { todoAll = !todoAll; return renderTodo(); }
  const row = e.target.closest("[data-jump]");
  if (row) jumpTo(row.dataset.jump);
});

const view = $("#view");
view.addEventListener("mouseover", (e) => { const el = e.target.closest(".station"); if (el) showTip(el); });
view.addEventListener("mouseout", (e) => { if (e.target.closest(".station")) hideTip(); });
view.addEventListener("focusin", (e) => { const el = e.target.closest(".station"); if (el) showTip(el); });
view.addEventListener("focusout", hideTip);
view.addEventListener("click", (e) => {
  const foldLine = e.target.closest("[data-fold-line]");
  if (foldLine) {
    toggleLineFold(foldLine.dataset.foldLine);
    return render();
  }
  const zoneHead = e.target.closest("[data-zone-head]");
  if (zoneHead) {
    const k = zoneHead.dataset.zoneHead;
    if (folded.zones.has(k)) folded.zones.delete(k); else folded.zones.add(k);
    saveFolded();
    return render();
  }
  // 卡头上的小三角、「收起支线」按钮、卡头空白处都能折 / 展（卡头里的链接和图钉除外）
  const famBtn = e.target.closest("[data-fam]") || (!e.target.closest("a, .pin-btn") && e.target.closest("[data-fam-head]"));
  if (famBtn) {
    const k = famBtn.dataset.fam || famBtn.dataset.famHead;
    if (famCollapsed.has(k)) famCollapsed.delete(k); else famCollapsed.add(k);
    saveFam();
    return render();
  }
  const pinBtn = e.target.closest("[data-pin-line]");
  if (pinBtn) return togglePin("project", pinBtn.dataset.pinLine);
  const act = e.target.closest(".line-act");
  if (act) return openLineDialog(act.dataset.line, act.dataset.act);
  if (e.target.closest("#show-archived")) { filters.scope = "all"; saveFilters(); return render(); }
  const pack = e.target.closest("[data-run]");
  if (pack) {
    const k = pack.dataset.run;
    if (openRuns.has(k)) openRuns.delete(k); else openRuns.add(k);
    return render();
  }
  const el = e.target.closest("[data-id]");
  if (el) openSheet(el.dataset.id);
});
// 右键一站 = 直接去改它的状态（和左键是同一个面板，只是光标先落在状态上）
view.addEventListener("contextmenu", (e) => {
  const el = e.target.closest("[data-id]");
  if (!el) return;
  e.preventDefault();
  openSheet(el.dataset.id, { focusEdit: true });
});
view.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches("tr[data-id]")) openSheet(e.target.dataset.id); });
window.addEventListener("scroll", hideTip, true);
scrim.addEventListener("click", async (e) => {
  const pinBtn = e.target.closest("[data-pin-task]");
  if (pinBtn) {
    // 就地更新按钮，不重画面板——面板里可能有还没提交的备注
    const id = pinBtn.dataset.pinTask;
    if (await togglePin("task", id)) {
      const on = !!byId.get(id).pinned;
      pinBtn.setAttribute("aria-pressed", String(on));
      pinBtn.innerHTML = `<span style="width:14px;display:inline-grid">${PIN(on)}</span>${on ? "取消置顶" : "置顶这一站"}`;
    }
    return;
  }
  if (e.target === scrim || e.target.closest("[data-close]")) closeModal();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") return closeModal();
  // P = 切换「只看置顶的」。正在输入文字、按着修饰键、或面板开着时不响应。
  if ((e.key === "p" || e.key === "P") && !e.ctrlKey && !e.metaKey && !e.altKey && scrim.hidden
      && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "")) {
    e.preventDefault();
    setPinFilter(!filters.pin);
  }
});

$("#meta").textContent = SERVER
  ? `数据来自 TODO.md 与 ARCHIVE.md（台账更新于 ${DATA.ledgerUpdated || "—"}）· 读取于 ${DATA.generatedAt.slice(11)} · 点一站（或右键）可以改状态、写备注；线路左侧可以归档整个项目`
  : `数据来自 TODO.md 与 ARCHIVE.md（台账更新于 ${DATA.ledgerUpdated || "—"}）· 本页生成于 ${DATA.generatedAt} · 这是只读快照；双击「打开地铁图.bat」打开的版本可以改状态、归档项目`;
if (SERVER && (SERVER.stale || SERVER.libError)) {
  const warn = document.createElement("div");
  warn.className = "meta-warn";
  warn.textContent = SERVER.stale
    ? "看板服务本身有更新：点右上角「刷新」重启服务、换上新版"
    : `看板代码有更新但没加载成功，还在用旧版，告诉 AI 修一下（${SERVER.libError}）`;
  $("header").append(warn);
}

/* 右上角「刷新」：让服务换上新版看板代码（服务本身更新了就重启），再重新载入页面 */
const refreshBtn = $("#refresh");
if (SERVER) {
  refreshBtn.hidden = false;
  refreshBtn.title = SERVER.stale ? "看板服务有更新：点一下重启服务并刷新" : "重新读取台账；看板代码更新过会顺带换上新版";
  if (SERVER.stale) refreshBtn.classList.add("primary");
  refreshBtn.addEventListener("click", refreshBoard);
}
async function refreshBoard() {
  const label = refreshBtn.querySelector("span");
  const busy = (on, text) => { refreshBtn.disabled = on; refreshBtn.classList.toggle("busy", on); label.textContent = text; };
  const fail = (msg) => { busy(false, "刷新"); toast(msg, 9000); };
  busy(true, "刷新中…");
  let r, j;
  try {
    r = await callServer("/api/refresh", { method: "POST", headers: { "Content-Type": "application/json", "X-Board-Token": SERVER.token }, body: "{}" });
    j = await r.json().catch(() => ({}));
  } catch (e) {
    return fail(e.message);
  }
  if (r.status === 403) return reloadWith("已刷新"); // 服务重启过、页面令牌旧了：重新载入即可
  if (r.status === 404) return fail("看板服务是旧版，还不认识「刷新」：关掉「看板服务」窗口，再双击「打开地铁图.bat」");
  if (!r.ok) return fail(j.error || `刷新出错了（${r.status}）`);
  if (j.restarting) {
    busy(true, "正在重启服务…");
    if (await waitForRestart(j.boot)) return reloadWith("看板服务已重启，页面是最新的");
    return fail("看板服务没能自动重启：双击看板目录里的「打开地铁图.bat」重新打开");
  }
  const warn = j.libError ? { result: { warnings: [`新版看板代码加载失败，还在用旧版：${j.libError}`] } } : null;
  reloadWith(j.reloaded ? "已换上新版看板代码并刷新" : "已刷新", warn);
}
async function waitForRestart(oldBoot) {
  for (let i = 0; i < 50; i++) { // 最多等 20 秒左右
    await new Promise((ok) => setTimeout(ok, 400));
    try {
      const j = await (await callServer("/api/ping", { method: "POST" }, 2000)).json();
      if (j.boot && j.boot !== oldBoot) return true;
    } catch (e) { /* 旧服务已退、新服务还没起来 */ }
  }
  return false;
}
render();

/* 深链：#T028 直接打开某一站；#table / #metro 切视图 */
function applyHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (/^T\d+$/.test(h)) { render(); openSheet(h); }
  else if (h === "table" || h === "metro") { filters.view = h; render(); }
}
window.addEventListener("hashchange", applyHash);
applyHash();

/* 操作完成后刷新回来：恢复滚动位置并提示结果 */
try {
  const flash = JSON.parse(sessionStorage.getItem("metro-flash") || "null");
  if (flash) { sessionStorage.removeItem("metro-flash"); window.scrollTo(0, flash.y || 0); toast(flash.msg, flash.ms); }
} catch (e) {}

/* 心跳：页面开着，本地服务就不会因空闲退出 */
if (SERVER) setInterval(() => { fetch("/api/ping", { method: "POST" }).catch(() => {}); }, 60 * 1000);
</script>
